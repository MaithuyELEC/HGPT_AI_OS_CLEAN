name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build, verify, package, and checksum
        id: release
        shell: pwsh
        run: ./scripts/windows/build_release.ps1

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LUCID-AUTO-${{ steps.release.outputs.version }}-windows-installer
          if-no-files-found: error
          path: |
            ${{ steps.release.outputs.installer }}
            ${{ steps.release.outputs.checksum }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = "${{ steps.release.outputs.installer }}"
          $checksum = "${{ steps.release.outputs.checksum }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksum --clobber
          } else {
            gh release create $tag $installer $checksum --verify-tag --title "LUCID AUTO $tag" --notes-file RELEASE_NOTES.md
          }
